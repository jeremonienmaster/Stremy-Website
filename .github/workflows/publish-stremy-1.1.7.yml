name: Publish Stremy 1.1.7
on:
  push:
    paths:
      - ".github/workflows/publish-stremy-1.1.7.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'jeremonienmaster/Stremy-Website'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Load signed Stremy assets and verify independent hashes
        shell: bash
        env:
          ASSETS_URL: "https://sdmntpritalynorth.oaiusercontent.com/files/00000000-2a38-8246-a8da-58330a8971ed/raw?se=2026-10-16T00%3A11%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=a22209ec-0d32-50ef-aa5e-c6cf0c871387&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T22%3A24%3A18Z&ske=2026-10-16T22%3A24%3A18Z&sks=b&skv=2026-02-06&sig=nxoSDlYivpKtLYIABBom14Wl3r/s2EGMtS%2BLDqoXHzM%3D"
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --connect-timeout 10 --max-time 120 "$ASSETS_URL" -o assets.zip
          test "$(wc -c < assets.zip)" -gt 16000000
          mkdir dist
          unzip -q assets.zip -d dist
          test -s dist/Stremy-v1.1.7.apk
          test -s dist/Stremy-v1.1.7-source.zip
          test -s dist/SHA256SUMS.txt
          cd dist
          sha256sum --check SHA256SUMS.txt
          printf '%s\n' '216c66340957b5e03d73e9ed6c6531d99c74b483f78fe6653acf0a9ca823c3cd  Stremy-v1.1.7.apk' | sha256sum --check -
          printf '%s\n' '67d48290e04a1cd95f85259ade27575bfc50b369f8bdf4b478cd7bce94e7a50f  Stremy-v1.1.7-source.zip' | sha256sum --check -

      - name: Publish latest stable release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: jeremonienmaster/Stremy-Website
        run: |
          set -euo pipefail
          if gh release view v1.1.7 >/dev/null 2>&1; then
            echo "::error::Release v1.1.7 already exists - refusing overwrite"
            exit 1
          fi
          cat > release-notes.txt <<'NOTES'
          Stremy 1.1.7 – Meine Streams: Systemleisten-Fix

          - Die kompakte obere Leiste berücksichtigt jetzt die Android-Statusleiste: Broadcast-Symbol, Titel, 3/2/Liste und Einstellungen erscheinen unterhalb von Uhr und Statussymbolen auf einer Linie mit dem Hamburger-Menü.
          - Die Streamliste berücksichtigt die Android-Navigationsleiste und 12 dp zusätzlichen Abstand. Der letzte Stream kann dadurch vollständig oberhalb der Systemtasten dargestellt werden.
          - Der dunkle Schatten über den Streamvorschauen bleibt entfernt.
          - Kompakte Zuschauerzahlen und die verbesserte Meine-Streams-Darstellung aus 1.1.5/1.1.6 bleiben erhalten.
          - Keine Änderung an Anmeldung, Player, Favoriten oder der automatischen Updatefunktion.

          Stremy lässt sich direkt aus der App über Einstellungen > Updates & Diagnose > Jetzt nach Updates suchen aktualisieren.
          Android fragt vor der Installation um Zustimmung. Bestehende App-Daten bleiben bei einem regulären Update erhalten.
          
          Offiziell signierte Android-APK, überprüfte SHA-256-Prüfsummen und passender GPL-3.0-Quellcode.
          Stremy ist ein unabhängiger Fork des Open-Source-Projekts Twire und kein offizieller Twitch-Client.
          NOTES
          gh release create v1.1.7             dist/Stremy-v1.1.7.apk             dist/Stremy-v1.1.7-source.zip             dist/SHA256SUMS.txt             --title "Stremy 1.1.7 – Systemleisten-Fix"             --notes-file release-notes.txt             --latest
