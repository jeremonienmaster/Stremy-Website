name: Publish Stremy 1.1.2
on:
  push:
    paths:
      - ".github/workflows/publish-stremy-1.1.2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'jeremonienmaster/Stremy-Website'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Load signed Stremy package
        env:
          STREMY_ARTIFACT_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-590c-81f4-98a9-8422c1be3161/raw?se=2026-10-15T00%3A39%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=42e87ece-c20d-50b8-88d4-090ee23b3e02&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-14T08%3A49%3A24Z&ske=2026-10-15T08%3A49%3A24Z&sks=b&skv=2026-02-06&sig=brEDo3G3sg8qh2iLUybp%2B8SheCx0EG2Doq41w5Z98UY%3D"
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --connect-timeout 10 --max-time 120 "$STREMY_ARTIFACT_URL" -o release-assets.zip
          test "$(wc -c < release-assets.zip)" -gt 16000000
          mkdir -p dist
          unzip -q release-assets.zip -d dist
          test -f dist/Stremy-v1.1.2.apk
          test -f dist/Stremy-v1.1.2-source.zip
          test -f dist/SHA256SUMS.txt
          cd dist
          sha256sum --check SHA256SUMS.txt
          echo "da126bd69f7743eebf4166410fff5de8d7728d83c718552fbc94318db51cb40d  Stremy-v1.1.2.apk" | sha256sum -c -
          echo "267d298ae641ae2ad0247e848c2f6e8c612838d6be0efbf1bf265c202a527cb3  Stremy-v1.1.2-source.zip" | sha256sum -c -

      - name: Publish official signed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: jeremonienmaster/Stremy-Website
        run: |
          set -euo pipefail
          if gh release view v1.1.2 >/dev/null 2>&1; then
            echo "Release v1.1.2 already exists; no overwrite"
            exit 1
          fi
          cat > release-notes.txt <<'NOTES'
          Stremy 1.1.2 – neue Farbschemata und aufgeräumte Theme-Auswahl

          - Neu: Stremy Green · Vibrant mit lebendigem Smaragdgrün.
          - Neu: Stremy Green · Lime als frische, hellgrüne Variante.
          - Stremy-Farben übersichtlich zusammengefasst.
          - Frühere Farbschemata weiterhin unter „Klassische Themes“ verfügbar.
          - Sichere Updateprüfung und In-App-Download aus Stremy 1.1.1 bleiben erhalten.
          - Bestehende Konten und Einstellungen bleiben beim Update erhalten.

          Offiziell signierte Android-APK und passendes GPL-Quellcodearchiv.
          Die APK wird von Android nur nach deiner Bestätigung installiert.
          NOTES
          gh release create v1.1.2             dist/Stremy-v1.1.2.apk             dist/Stremy-v1.1.2-source.zip             dist/SHA256SUMS.txt             --title "Stremy 1.1.2 – Green Themes"             --notes-file release-notes.txt             --latest
