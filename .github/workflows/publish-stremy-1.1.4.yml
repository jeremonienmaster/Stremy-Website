name: Publish Stremy 1.1.4
on:
  push:
    paths:
      - ".github/workflows/publish-stremy-1.1.4.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'jeremonienmaster/Stremy-Website'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download and verify signed Stremy 1.1.4 assets
        env:
          STREMY_ARTIFACT_URL: "https://sdmntprcacentral.oaiusercontent.com/files/00000000-7028-820d-a9b7-071c9af5211c/raw?se=2026-10-15T13%3A34%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=04f35418-f5ae-5ac1-ad99-bfab6beef008&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T05%3A24%3A01Z&ske=2026-10-16T05%3A24%3A01Z&sks=b&skv=2026-02-06&sig=6VDnVA8LZ1yLIVLhwMfwopIOlANy88PYXNPUUu69Y0k%3D"
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --connect-timeout 10 --max-time 120 "$STREMY_ARTIFACT_URL" -o assets.zip
          test "$(wc -c < assets.zip)" -gt 16000000
          mkdir -p dist
          unzip -q assets.zip -d dist
          test -s dist/Stremy-v1.1.4.apk
          test -s dist/Stremy-v1.1.4-source.zip
          test -s dist/SHA256SUMS.txt
          cd dist
          sha256sum -c SHA256SUMS.txt
          printf '%s\n' '16c5843e6156c2e9fc590f19168a5e381e8972028dc9f193fb3b7fdd817ececa  Stremy-v1.1.4.apk' | sha256sum -c -
          printf '%s\n' '17d22aef22dd4f15b2993657171ae1f99b78c80673dcf0fd9cac2ea9b98a52eb  Stremy-v1.1.4-source.zip' | sha256sum -c -

      - name: Publish verified official release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: jeremonienmaster/Stremy-Website
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.1.4 >/dev/null 2>&1; then
            echo "::error::v1.1.4 already exists - refusing overwrite"
            exit 1
          fi
          cat > release-notes.txt <<'NOTES'
          Stremy 1.1.4 – Update-Test und Diagnose

          Neu in dieser Version:
          - Update-Status unter Einstellungen > Updates & Diagnose: installierte Version, neuester öffentlicher Release und letzte erfolgreiche Prüfung.
          - Patchnotes über den neuen Button in den Einstellungen erneut öffnen.
          - Kompakteres Updatefenster mit weniger Leerraum und zum Theme passenden Farben.
          - Speicherschonende SHA-256-Prüfung für zwischengespeicherte APK-Dateien.
          - Die Verbesserungen aus 1.1.3 bleiben enthalten: Patchnotes vor dem Download und automatische Fortsetzung nach Freigabe der Android-Installationsberechtigung.

          Diese Veröffentlichung dient auch dem Live-Test des direkten In-App-Updates von Stremy 1.1.3 auf 1.1.4.
          Die Installation benötigt die ausdrückliche Bestätigung durch Android. Bitte Stremy zur Fehlersuche nicht deinstallieren.

          APK offiziell signiert. Lizenz: GPL-3.0. Der passende Quellcode und SHA256SUMS.txt stehen in diesem Release.
          Stremy basiert auf Twire und ist weder ein offizielles Twitch-Produkt noch mit Twitch verbunden.
          NOTES
          gh release create v1.1.4             dist/Stremy-v1.1.4.apk             dist/Stremy-v1.1.4-source.zip             dist/SHA256SUMS.txt             --title "Stremy 1.1.4 – Update-Test & Diagnose"             --notes-file release-notes.txt             --latest
